<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0A0A0C" />
  <g transform="translate(32, 32)">
    <!-- Overlapping orbital rings -->
    <ellipse cx="0" cy="0" rx="27" ry="16" fill="none" stroke="#FFFFFF" stroke-width="1.8" transform="rotate(-6)" />
    <ellipse cx="0" cy="0" rx="27" ry="16" fill="none" stroke="#FFFFFF" stroke-width="1.8" transform="rotate(6)" />
    <!-- 4-point sparkle star -->
    <path d="M 0,-13 C 0.5,-10 2,-8.5 5,-8 C 2,-7.5 0.5,-6 0,-3 C -0.5,-6 -2,-7.5 -5,-8 C -2,-8.5 -0.5,-10 0,-13 Z" fill="#FF5A1F" />
    <!-- BW Wordmark -->
    <text x="0" y="4" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="'Syne', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="16" letter-spacing="-0.04em">BW</text>
  </g>
</svg>
